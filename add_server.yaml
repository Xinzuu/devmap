---
- name: Install tarefiq on all servers
  hosts: tarefiq_servers
  become: true
  serial: 5               # roll out 5 servers at a time
  max_fail_percentage: 10

  vars:
    tarefiq_version: "1.0.0"                       # TODO: set real version
    tarefiq_url: "https://example.com/tarefiq-{{ tarefiq_version }}.tar.gz"  # TODO
    tarefiq_checksum: "sha256:REPLACE_ME"          # TODO
    tarefiq_install_dir: /opt/tarefiq
    tarefiq_user: tarefiq

  tasks:
    - name: Install prerequisites
      ansible.builtin.package:
        name: [curl, tar]
        state: present

    - name: Create service user
      ansible.builtin.user:
        name: "{{ tarefiq_user }}"
        system: true
        shell: /usr/sbin/nologin

    - name: Create install directory
      ansible.builtin.file:
        path: "{{ tarefiq_install_dir }}"
        state: directory
        owner: "{{ tarefiq_user }}"
        mode: "0755"

    - name: Download and extract tarefiq
      ansible.builtin.unarchive:
        src: "{{ tarefiq_url }}"
        dest: "{{ tarefiq_install_dir }}"
        remote_src: true
        checksum: "{{ tarefiq_checksum }}"
        owner: "{{ tarefiq_user }}"
        extra_opts: [--strip-components=1]
      notify: Restart tarefiq

    - name: Deploy systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/tarefiq.service
        mode: "0644"
        content: |
          [Unit]
          Description=tarefiq
          After=network.target

          [Service]
          User={{ tarefiq_user }}
          ExecStart={{ tarefiq_install_dir }}/bin/tarefiq   # TODO: real start command
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart tarefiq

    - name: Enable and start tarefiq
      ansible.builtin.systemd:
        name: tarefiq
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart tarefiq
      ansible.builtin.systemd:
        name: tarefiq
        state: restarted
